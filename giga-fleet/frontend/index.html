<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giga Fleet - Login</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Canvas para animação de partículas -->
    <canvas id="particlesCanvas"></canvas>
    
    <!-- Container Principal -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <img src="assets/images/logo-giga.png" alt="Giga Soluções Audiovisuais" id="logo">
                <h1>Giga Fleet</h1>
                <p>Sistema de Gestão de Frota e Operações</p>
            </div>
            
            <!-- Formulário de Login -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Usuário" 
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Senha" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Entrar</span>
                    <div class="btn-loader" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </button>
                
                <div class="auth-footer">
                    <p>© 2026 Giga Soluções Audiovisuais</p>
                    <p class="version">v1.0.0</p>
                </div>
            </form>
            
            <!-- Mensagem de Erro -->
            <div id="errorMessage" class="error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Erro ao fazer login</span>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/particles.js"></script>
</body>
</html>
