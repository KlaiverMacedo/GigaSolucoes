<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos - Giga Fleet</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/technicians.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/cards.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-left">
            <a href="dashboard.html" class="navbar-logo">
                <img src="../assets/images/logo-giga.png" alt="Giga">
                <span>Giga<span class="highlight">Fleet</span></span>
            </a>
        </div>

        <div class="navbar-center">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="fleet.html" class="nav-item">
                <i class="fas fa-truck"></i> Frota
            </a>
            <a href="technicians.html" class="nav-item active">
                <i class="fas fa-users"></i> Técnicos
            </a>
            <a href="operations.html" class="nav-item">
                <i class="fas fa-calendar-check"></i> Operações
            </a>
            <a href="planning.html" class="nav-item">
                <i class="fas fa-clock"></i> Planejamento
            </a>
        </div>

        <div class="navbar-right">
            <span class="navbar-date" id="currentDate"></span>

            <button class="navbar-notifications" title="Notificações">
                <i class="fas fa-bell"></i>
                <span class="badge">3</span>
            </button>

            <div style="position: relative;">
                <div class="navbar-user" id="userMenuBtn">
                    <div class="navbar-avatar" id="userAvatar">A</div>
                    <div class="navbar-user-info">
                        <span class="name" id="userName">Administrador</span>
                        <span class="role" id="userRole">Admin</span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; color: rgba(255,255,255,0.3); margin-left: 4px;"></i>
                </div>

                <div class="user-dropdown" id="userDropdown">
                    <button class="dropdown-item" onclick="window.location.href='profile.html'">
                        <i class="fas fa-user"></i> Meu Perfil
                    </button>
                    <button class="dropdown-item" onclick="window.location.href='settings.html'">
                        <i class="fas fa-cog"></i> Configurações
                    </button>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-main">
        <!-- Header -->
        <div class="technicians-header">
            <div class="technicians-header-left">
                <h1>Técnicos</h1>
                <p>Gerencie todos os técnicos da Giga Soluções Audiovisuais</p>
            </div>
            <div class="technicians-header-right">
                <button class="btn-primary" id="btnNewTechnician">
                    <i class="fas fa-plus"></i> Novo Técnico
                </button>
                <button class="btn-secondary">
                    <i class="fas fa-file-export"></i> Exportar
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="technicians-filters">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchTechnician" placeholder="Buscar técnico por nome, função ou equipe...">
            </div>
            <select id="filterTeam">
                <option value="">Todas as equipes</option>
                <option value="Montagem">Montagem</option>
                <option value="Operação">Operação</option>
                <option value="Áudio">Áudio</option>
                <option value="Vídeo">Vídeo</option>
                <option value="Iluminação">Iluminação</option>
            </select>
            <select id="filterAvailability">
                <option value="">Todos os status</option>
                <option value="true">Disponível</option>
                <option value="false">Ocupado</option>
            </select>
        </div>

        <!-- Grid de Técnicos -->
        <div class="technicians-grid" id="techniciansGrid">
            <!-- Cards serão inseridos via JavaScript -->
        </div>
    </main>

    <!-- Modal - Novo/Editar Técnico -->
    <div class="modal-overlay" id="technicianModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Técnico</h2>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form class="modal-form" id="technicianForm">
                <input type="hidden" id="technicianId">

                <div class="form-group">
                    <label for="name">Nome Completo *</label>
                    <input type="text" id="name" placeholder="Nome do técnico" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Telefone</label>
                        <input type="text" id="phone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="form-group">
                        <label for="function">Função *</label>
                        <select id="function" required>
                            <option value="">Selecione...</option>
                            <option value="Áudio">Áudio</option>
                            <option value="Vídeo">Vídeo</option>
                            <option value="Iluminação">Iluminação</option>
                            <option value="Montagem">Montagem</option>
                            <option value="Operação">Operação</option>
                            <option value="Motorista">Motorista</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="team">Equipe</label>
                        <select id="team">
                            <option value="">Selecione...</option>
                            <option value="Montagem">Montagem</option>
                            <option value="Operação">Operação</option>
                            <option value="Áudio">Áudio</option>
                            <option value="Vídeo">Vídeo</option>
                            <option value="Iluminação">Iluminação</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="availability">Disponibilidade</label>
                        <select id="availability">
                            <option value="true">Disponível</option>
                            <option value="false">Ocupado</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="observationsTech">Observações</label>
                    <textarea id="observationsTech" placeholder="Observações sobre o técnico..."></textarea>
                </div>

                <div class="form-group">
                    <label>Foto (opcional)</label>
                    <div class="photo-preview">
                        <div class="preview-circle" id="photoPreview">
                            <i class="fas fa-user"></i>
                        </div>
                        <button type="button" class="upload-btn" id="uploadPhotoBtn">
                            <i class="fas fa-upload"></i> Upload
                        </button>
                        <input type="file" id="photoInput" accept="image/*" style="display: none;">
                        <input type="hidden" id="photoUrl">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
                    <button type="submit" class="btn-save" id="btnSave">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api/client.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/technicians.js"></script>
</body>

</html>
