<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frota - Giga Fleet</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/fleet.css">
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/components/cards.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navbar -->
    <!-- Navbar -->
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="navbar-left">
            <a href="dashboard.html" class="navbar-logo">
                <img src="../assets/images/logo-giga.png" alt="Giga">
                <span>Giga<span class="highlight">Fleet</span></span>
            </a>
        </div>

        <div class="navbar-center">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="fleet.html" class="nav-item active">
                <i class="fas fa-truck"></i> Frota
            </a>
            <a href="technicians.html" class="nav-item">
                <i class="fas fa-users"></i> Técnicos
            </a>
            <a href="operations.html" class="nav-item">
                <i class="fas fa-calendar-check"></i> Operações
            </a>
            <a href="planning.html" class="nav-item">
                <i class="fas fa-clock"></i> Planejamento
            </a>
        </div>

        <div class="navbar-right">
            <span class="navbar-date" id="currentDate"></span>

            <button class="navbar-notifications" title="Notificações">
                <i class="fas fa-bell"></i>
                <span class="badge">3</span>
            </button>

            <div style="position: relative;">
                <div class="navbar-user" id="userMenuBtn">
                    <div class="navbar-avatar" id="userAvatar">A</div>
                    <div class="navbar-user-info">
                        <span class="name" id="userName">Administrador</span>
                        <span class="role" id="userRole">Admin</span>
                    </div>
                    <i class="fas fa-chevron-down"
                        style="font-size: 12px; color: rgba(255,255,255,0.3); margin-left: 4px;"></i>
                </div>

                <div class="user-dropdown" id="userDropdown">
                    <button class="dropdown-item" onclick="window.location.href='profile.html'">
                        <i class="fas fa-user"></i> Meu Perfil
                    </button>
                    <button class="dropdown-item" onclick="window.location.href='settings.html'">
                        <i class="fas fa-cog"></i> Configurações
                    </button>
                    <div class="dropdown-divider"></div>
                    <button class="dropdown-item danger" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-main">
        <!-- Header -->
        <div class="fleet-header">
            <div class="fleet-header-left">
                <h1>Frota</h1>
                <p>Gerencie todos os veículos da Giga Soluções Audiovisuais</p>
            </div>
            <div class="fleet-header-right">
                <button class="btn-primary" id="btnNewVehicle">
                    <i class="fas fa-plus"></i> Novo Veículo
                </button>
                <button class="btn-secondary">
                    <i class="fas fa-file-export"></i> Exportar
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="fleet-filters">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchVehicle" placeholder="Buscar veículo por placa, modelo ou marca...">
            </div>
            <select id="filterStatus">
                <option value="">Todos os status</option>
                <option value="DISPONIVEL">Disponível</option>
                <option value="EM_USO">Em Uso</option>
                <option value="MANUTENCAO">Manutenção</option>
                <option value="RESERVADO">Reservado</option>
            </select>
        </div>

        <!-- Grid de Veículos -->
        <div class="vehicles-grid" id="vehiclesGrid">
            <!-- Cards serão inseridos via JavaScript -->
        </div>
    </main>

    <!-- Modal - Novo/Editar Veículo -->
    <div class="modal-overlay" id="vehicleModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Veículo</h2>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form class="modal-form" id="vehicleForm">
                <input type="hidden" id="vehicleId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="plate">Placa *</label>
                        <input type="text" id="plate" placeholder="ABC-1234" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" required>
                            <option value="DISPONIVEL">Disponível</option>
                            <option value="EM_USO">Em Uso</option>
                            <option value="MANUTENCAO">Manutenção</option>
                            <option value="RESERVADO">Reservado</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="model">Modelo *</label>
                        <input type="text" id="model" placeholder="Scudo, Fiorino, etc." required>
                    </div>
                    <div class="form-group">
                        <label for="brand">Marca *</label>
                        <input type="text" id="brand" placeholder="Fiat, Mercedes, etc." required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="capacity">Capacidade</label>
                    <input type="text" id="capacity" placeholder="2 passageiros, Carga 800kg, etc.">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="driver">Motorista Responsável</label>
                        <input type="text" id="driver" placeholder="Nome do motorista">
                    </div>
                    <div class="form-group">
                        <label for="mileage">Quilometragem (km)</label>
                        <input type="number" id="mileage" placeholder="0" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="docDate">Data da Documentação</label>
                        <input type="date" id="docDate">
                    </div>
                    <div class="form-group">
                        <label for="nextMaintenance">Próxima Manutenção</label>
                        <input type="date" id="nextMaintenance">
                    </div>
                </div>

                <div class="form-group">
                    <label for="observations">Observações</label>
                    <textarea id="observations" placeholder="Observações sobre o veículo..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
                    <button type="submit" class="btn-save" id="btnSave">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api/client.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/fleet.js"></script>
</body>

</html>
